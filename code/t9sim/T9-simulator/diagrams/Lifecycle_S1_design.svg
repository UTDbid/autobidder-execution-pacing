<text x="590" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#212121">Stage 1 — Parameter &amp; BN design</text>
<text x="590" y="54" text-anchor="middle" font-size="11.5" fill="#546E7A">Nothing realised yet: we author the joint law + parameters; the three roles exist only as designed distributions.</text>
