<rect x="40" y="600" width="1100" height="78" rx="9" fill="#F7F9FB" stroke="#CFD8DC" stroke-width="1.2"/>
<text x="52" y="619" font-size="10.5" font-weight="700" fill="#455A64">Key points</text>
<text x="52" y="637" font-size="10" fill="#37474F">- Latents are INVENTED here (iPinYou has no latent ground truth — only marginal shapes).</text>
<text x="52" y="652" font-size="10" fill="#37474F">- Tilts are marginal-preserving (sum_k pi_k*delta=0) so generating latent-first keeps calibration.</text>
<text x="52" y="667" font-size="10" fill="#37474F">- EV_hat is the PRODUCT of 4 heads, never a fitted head on ev_truth.</text>
<line x1="40" y1="700" x2="64" y2="700" stroke="#1B5E20" stroke-width="2.4" marker-end="url(#mgenerative)"/>
