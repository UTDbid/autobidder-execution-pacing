<rect x="510" y="582" width="554" height="114" rx="9" fill="#FFFDE7" stroke="#E6C200" stroke-width="1.2"/>
<text x="522" y="600" font-size="9.5" font-weight="700" fill="#5D4E00" font-family="Consolas, monospace">Schema formulas (v6):</text>
<text x="522" y="615" font-size="9.5" font-weight="400" fill="#5D4E00" font-family="Consolas, monospace">P(click)  = base_ctr . LU2 . v_slot . m(r) . LA1 . LC1            [L218/292]</text>
<text x="522" y="630" font-size="9.5" font-weight="400" fill="#5D4E00" font-family="Consolas, monospace">P(install|click) = base_ir . LU3 . ease(B2) . m(r) . LA1          [L220/293]</text>
<text x="522" y="645" font-size="9.5" font-weight="400" fill="#5D4E00" font-family="Consolas, monospace">v_slot = format_weight(B6) . size_weight(B4,B5)                   [L216]</text>
<text x="522" y="660" font-size="9.5" font-weight="400" fill="#5D4E00" font-family="Consolas, monospace">m(r) = LU6[ad_genre]  (observable C4 x LATENT LU6)               [L205-207]</text>
<text x="522" y="675" font-size="9.5" font-weight="400" fill="#5D4E00" font-family="Consolas, monospace">H2 bid = k_cpa(C2) . v_slot . ease(B2) . E[ltv|B2] . shade . noise [L250/302]</text>
<text x="522" y="690" font-size="9.5" font-weight="400" fill="#5D4E00" font-family="Consolas, monospace">won = [H2 &gt;= max(LU7, floor)] ; clearing = H2 if won, LU7 if lost-sold [L257-260]</text>
