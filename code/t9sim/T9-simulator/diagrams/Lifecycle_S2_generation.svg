<rect width="1180" height="740" fill="#FFFFFF"/>
<text x="590" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#212121">Stage 2 — Data generation (master)</text>
<text x="590" y="54" text-anchor="middle" font-size="11.5" fill="#546E7A">Ancestral sampling: latents drawn FIRST, observables constructed from them, labels realised on ALL rows. Nothing hidden yet.</text>
<text x="180" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#90A4AE">OBSERVABLES</text>
<text x="595" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#90A4AE">LATENT GROUND TRUTH</text>
<text x="997" y="84" text-anchor="middle" font-size="11" font-weight="700" fill="#90A4AE">OUTCOME LABELS</text>
<line x1="450" y1="133" x2="320" y2="136" stroke="#BDBDBD" stroke-width="1.6" stroke-dasharray="3,4" marker-end="url(#minert)"/>
<text x="385" y="129" text-anchor="middle" font-size="9" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" font-weight="600">archetype -&gt; A/D  (INERT: A perp L)</text>
<line x1="320" y1="186" x2="450" y2="192" stroke="#616161" stroke-width="1.6" stroke-dasharray="7,4" marker-end="url(#mlookup)"/>
<text x="385" y="184" text-anchor="middle" font-size="9" fill="#616161" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" font-weight="600">id -&gt; entity latent (active)</text>
<line x1="740" y1="161" x2="855" y2="160" stroke="#1B5E20" stroke-width="2.2" marker-end="url(#mgenerative)"/>
<text x="798" y="156" text-anchor="middle" font-size="9" fill="#1B5E20" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" font-weight="600">labels on ALL rows ; EV -&gt; LU7</text>
<g><rect x="40" y="100" width="280" height="120" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
<text x="180" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">OBSERVABLES  (X)</text>
<text x="180" y="140" text-anchor="middle" font-size="9.5" fill="#37474F">A user · B app · C campaign · D time</text>
<text x="180" y="154" text-anchor="middle" font-size="9.5" fill="#37474F">keys: app_id/campaign_id · context: slot/time</text>
<text x="180" y="211" text-anchor="middle" font-size="9.5" font-style="italic" font-weight="700" fill="#2E7D32">[REALISED — generator owns]</text>
</g>
<g><rect x="450" y="90" width="290" height="142" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
<text x="595" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">LATENT GROUND TRUTH  (L)</text>
<text x="595" y="130" text-anchor="middle" font-size="9.5" fill="#37474F">LU1-7 · LA1/2 · LC1/2</text>
<text x="595" y="144" text-anchor="middle" font-size="9.5" fill="#37474F">estimands p_*, e_ltv, ev_truth</text>
<text x="595" y="223" text-anchor="middle" font-size="9.5" font-style="italic" font-weight="700" fill="#2E7D32">[REALISED — generator owns]</text>
</g>
<g><rect x="855" y="100" width="285" height="120" rx="9" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8"/>
<text x="998" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#1A1A1A">OUTCOME LABELS  (Y)</text>
<text x="998" y="140" text-anchor="middle" font-size="9.5" fill="#37474F">E click · F install · G payer/LTV</text>
<text x="998" y="154" text-anchor="middle" font-size="9.5" fill="#37474F">H3 won · H4 clearing</text>
<text x="998" y="211" text-anchor="middle" font-size="9.5" font-style="italic" font-weight="700" fill="#2E7D32">[REALISED on ALL rows]</text>
</g>
<rect x="40" y="600" width="1100" height="78" rx="9" fill="#F7F9FB" stroke="#CFD8DC" stroke-width="1.2"/>
<text x="52" y="619" font-size="10.5" font-weight="700" fill="#455A64">Key points</text>
<text x="52" y="637" font-size="10" fill="#37474F">- Master is uncensored — every row has E/F/G; the only NaN is H4 on unsold rows.</text>
<text x="52" y="652" font-size="10" fill="#37474F">- Generator OWNS the latents: 'latent' = hidden from the LEARNER, not from the simulator.</text>
<text x="52" y="667" font-size="10" fill="#37474F">- Lost-row outcomes are the declared counterfactual (no formula reads `won`).</text>
<line x1="40" y1="700" x2="64" y2="700" stroke="#1B5E20" stroke-width="2.4" marker-end="url(#mgenerative)"/>
<text x="70" y="704" font-size="9.5" fill="#37474F">generative (build the world): L -&gt; X, L -&gt; Y</text>
<line x1="324.8" y1="700" x2="348.8" y2="700" stroke="#BDBDBD" stroke-width="2.4" stroke-dasharray="3,4" marker-end="url(#minert)"/>
<text x="354.8" y="704" font-size="9.5" fill="#37474F">designed but INERT (A perp L pre-BN)</text>
<line x1="564.0" y1="700" x2="588.0" y2="700" stroke="#616161" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#mlookup)"/>
<text x="594.0" y="704" font-size="9.5" fill="#37474F">key lookup: id -&gt; entity latent</text>
<text x="40" y="720" font-size="9.5" font-style="italic" fill="#90A4AE">box colour + [pill] = the role's availability at this stage</text>
</svg>