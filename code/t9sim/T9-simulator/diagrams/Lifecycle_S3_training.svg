<text x="552" y="266" text-anchor="middle" font-size="9" fill="#1565C0" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" font-weight="600">must invert X-&gt;L-&gt;Y (L unseen)</text>
<line x1="740" y1="178" x2="855" y2="166" stroke="#BDBDBD" stroke-width="1.6" stroke-dasharray="3,4" marker-end="url(#minert)"/>
<text x="798" y="167" text-anchor="middle" font-size="9" fill="#BDBDBD" stroke="#FFFFFF" stroke-width="3" paint-order="stroke" font-weight="600">gen. law (learned about, not seen)</text>
