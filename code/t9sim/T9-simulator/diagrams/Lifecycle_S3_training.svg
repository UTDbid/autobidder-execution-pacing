<text x="309.20000000000005" y="704" font-size="9.5" fill="#37474F">inference: model consumes X  (X -&gt; Y_hat)</text>
<line x1="546.9000000000001" y1="700" x2="570.9000000000001" y2="700" stroke="#00838F" stroke-width="2.4" marker-end="url(#mtarget)"/>
<text x="576.9000000000001" y="704" font-size="9.5" fill="#37474F">supervision / labels</text>
<text x="40" y="720" font-size="9.5" font-style="italic" fill="#90A4AE">box colour + [pill] = the role's availability at this stage</text>
