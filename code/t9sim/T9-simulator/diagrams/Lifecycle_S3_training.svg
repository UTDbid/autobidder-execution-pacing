<rect width="1180" height="740" fill="#FFFFFF"/>
<text x="590" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#212121">Stage 3 — Model training</text>
<text x="590" y="54" text-anchor="middle" font-size="11.5" fill="#546E7A">Fit P(Y|X) on the censored train split: model sees only X and per-condition-visible Y; latents are hidden and must be implicitly inverted.</text>
