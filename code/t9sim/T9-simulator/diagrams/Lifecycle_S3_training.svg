<rect x="40" y="600" width="1100" height="78" rx="9" fill="#F7F9FB" stroke="#CFD8DC" stroke-width="1.2"/>
<text x="52" y="619" font-size="10.5" font-weight="700" fill="#455A64">Key points</text>
<text x="52" y="637" font-size="10" fill="#37474F">- Dropped + leakage-guarded: latents (LU/LA/LC), estimands (p_*, e_ltv, ev_truth), user_id.</text>
<text x="52" y="652" font-size="10" fill="#37474F">- Per-condition TRAIN population (won-only vs all-rows) IS the MMP ablation mechanism.</text>
<text x="52" y="667" font-size="10" fill="#37474F">- Temporal split (days 1-20) precedes censoring; C3/C4 un-censor exact LU7 via H4 as the AFT label bound.</text>
<line x1="40" y1="700" x2="64" y2="700" stroke="#BDBDBD" stroke-width="2.4" stroke-dasharray="3,4" marker-end="url(#minert)"/>
<text x="70" y="704" font-size="9.5" fill="#37474F">designed but INERT (A perp L pre-BN)</text>
