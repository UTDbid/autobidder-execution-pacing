<text x="52" y="636" font-size="10.5" font-weight="400" fill="#5D4E00">Nesting (observable -&gt; observable):  A2 city &lt;- A1 region ;  A4 os_version &lt;- A3 os</text>
<text x="52" y="654" font-size="10.5" font-weight="400" fill="#5D4E00">won = [ bid &gt;= max(LU7, floor H1) ] ;  clearing = bid if won, LU7 if lost-sold</text>
