<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="'Anthropic Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect width="1000" height="1010" fill="#0E1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#C2C0B6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="30" y="26" width="280" height="74" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="170" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#9FE1CB">iPinYou dataset</text>
<text x="170" y="61" text-anchor="middle" font-size="10" font-weight="400" fill="#5DCAA5">Demographics, prices,</text>
<text x="170" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#5DCAA5">auction distributions</text>
<rect x="350" y="26" width="280" height="74" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="490" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#CECBF6">Industry reports</text>
<text x="490" y="61" text-anchor="middle" font-size="10" font-weight="400" fill="#AFA9EC">Base CTR, install &amp; payer</text>
<text x="490" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#AFA9EC">rate, LTV, eCPM targets</text>
<rect x="670" y="26" width="280" height="74" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="810" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#CECBF6">Archetype design</text>
<text x="810" y="61" text-anchor="middle" font-size="10" font-weight="400" fill="#AFA9EC">User / app / campaign</text>
<text x="810" y="75" text-anchor="middle" font-size="10" font-weight="400" fill="#AFA9EC">behaviour · causal mechanisms</text>
<line x1="170" y1="100" x2="170" y2="150" stroke="#1F7A63" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="490" y1="100" x2="490" y2="150" stroke="#534AB7" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="810" y1="100" x2="810" y2="150" stroke="#534AB7" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="20" y="150" width="960" height="548" rx="16" fill="none" stroke="rgba(222,220,209,0.3)" stroke-width="1" stroke-dasharray="5 3"/>
<text x="40" y="176" font-size="16" font-weight="600" text-anchor="start" fill="#FAF9F5">T9 Simulator</text>
<rect x="36" y="192" width="928" height="196" rx="10" fill="#11161D" stroke="#39424D" stroke-width="0.8"/>
<text x="50" y="214" font-size="12.5" font-weight="600" text-anchor="start" fill="#FAF9F5">1.  Three pools  (user / app / campaign — pre-generated)   ·   10M users</text>
<text x="194" y="232" font-size="11" font-weight="600" text-anchor="middle" fill="#FAF9F5">USER POOL</text>
<rect x="52" y="238" width="284" height="60" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="194" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9FE1CB">A — user features</text>
<text x="194" y="272" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5DCAA5">region · city · OS · OS-ver · device</text>
<rect x="52" y="318" width="284" height="60" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="194" y="332" text-anchor="middle" font-size="11.5" font-weight="600" fill="#CECBF6">LU1–LU6  (latent)</text>
<text x="194" y="345" text-anchor="middle" font-size="9.5" font-weight="400" fill="#AFA9EC">archetype · click/install/pay</text>
<text x="194" y="358" text-anchor="middle" font-size="9.5" font-weight="400" fill="#AFA9EC">LTV mult · interest vector</text>
<text x="498" y="232" font-size="11" font-weight="600" text-anchor="middle" fill="#FAF9F5">APP POOL</text>
<rect x="356" y="238" width="284" height="60" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="498" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9FE1CB">B — app</text>
<text x="498" y="272" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5DCAA5">app_id · app_category</text>
<rect x="356" y="318" width="284" height="60" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="498" y="338" text-anchor="middle" font-size="11.5" font-weight="600" fill="#CECBF6">LA1–LA2  (latent)</text>
<text x="498" y="352" text-anchor="middle" font-size="9.5" font-weight="400" fill="#AFA9EC">app_quality · audience_profile</text>
<text x="802" y="232" font-size="11" font-weight="600" text-anchor="middle" fill="#FAF9F5">CAMPAIGN POOL</text>
<rect x="660" y="238" width="284" height="60" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="802" y="258" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9FE1CB">C — campaign</text>
<text x="802" y="272" text-anchor="middle" font-size="9.5" font-weight="400" fill="#5DCAA5">advertiser · scale · campaign · ad_genre</text>
<rect x="660" y="318" width="284" height="60" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="802" y="338" text-anchor="middle" font-size="11.5" font-weight="600" fill="#CECBF6">LC1–LC2  (latent)</text>
<text x="802" y="352" text-anchor="middle" font-size="9.5" font-weight="400" fill="#AFA9EC">creative_appeal · game_quality</text>
<line x1="500" y1="388" x2="500" y2="410" stroke="#C2C0B6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="36" y="410" width="928" height="272" rx="10" fill="#11161D" stroke="#39424D" stroke-width="0.8"/>
<text x="50" y="432" font-size="12.5" font-weight="600" text-anchor="start" fill="#FAF9F5">2.  Auction + outcome generator   ·   up to 100M bids, 30M won</text>
<text x="194" y="456" font-size="11" font-weight="600" text-anchor="middle" fill="#FAF9F5">DSP  (bid-side)</text>
<text x="498" y="456" font-size="11" font-weight="600" text-anchor="middle" fill="#FAF9F5">MMP  (post-install)</text>
<text x="802" y="456" font-size="11" font-weight="600" text-anchor="middle" fill="#FAF9F5">SSP  (auction)</text>
<rect x="52" y="464" width="284" height="50" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="194" y="493" text-anchor="middle" font-size="10.5" font-weight="600" fill="#9FE1CB">A user · B app/slot/exchange · C campaign · D time</text>
<rect x="52" y="520" width="284" height="44" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="194" y="546" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9FE1CB">E — Click label</text>
<rect x="52" y="570" width="284" height="44" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="194" y="596" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9FE1CB">H1 floor · H2 bid · H3 won</text>
<rect x="356" y="464" width="284" height="50" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="498" y="493" text-anchor="middle" font-size="11.5" font-weight="600" fill="#CECBF6">F — Install label</text>
<rect x="356" y="520" width="284" height="50" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="498" y="549" text-anchor="middle" font-size="11.5" font-weight="600" fill="#CECBF6">G — Payer / LTV (G1–G4)</text>
<rect x="660" y="464" width="284" height="50" rx="10" fill="#085041" stroke="#5DCAA5" stroke-width="1"/>
<text x="802" y="493" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9FE1CB">H4 — Clearing price</text>
<rect x="660" y="520" width="284" height="50" rx="10" fill="#3C3489" stroke="#AFA9EC" stroke-width="1"/>
<text x="802" y="549" text-anchor="middle" font-size="10.5" font-weight="600" fill="#CECBF6">LU7 — competing bid (latent)</text>
<line x1="420" y1="698" x2="250" y2="742" stroke="#C2C0B6" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="580" y1="698" x2="752" y2="742" stroke="#C2C0B6" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="60" y="744" width="384" height="120" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="252" y="778" text-anchor="middle" font-size="13" font-weight="600" fill="#B5D4F4">Tier 1 — User-value prediction</text>
<text x="252" y="794" text-anchor="middle" font-size="11" font-weight="400" fill="#85B7EB">Features: A, B, C, D  (+ H1 floor)</text>
<text x="252" y="808" text-anchor="middle" font-size="11" font-weight="400" fill="#85B7EB">Labels: E, F, G</text>
<text x="252" y="824" text-anchor="middle" font-size="11" font-weight="400" fill="#85B7EB">→ P(click), P(install), P(payer), E(spend)</text>
<rect x="558" y="744" width="384" height="120" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="750" y="778" text-anchor="middle" font-size="13" font-weight="600" fill="#B5D4F4">Tier 2 — Win probability</text>
<text x="750" y="794" text-anchor="middle" font-size="11" font-weight="400" fill="#85B7EB">Features: A, B, C, D, H1, H2, H4</text>
<text x="750" y="808" text-anchor="middle" font-size="11" font-weight="400" fill="#85B7EB">Label: H3 (won / lost)</text>
<text x="750" y="824" text-anchor="middle" font-size="11" font-weight="400" fill="#85B7EB">→ P(win | bid, context)</text>
<line x1="252" y1="864" x2="360" y2="906" stroke="#C2C0B6" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="750" y1="864" x2="642" y2="906" stroke="#C2C0B6" stroke-width="1.5" marker-end="url(#a)"/>
<text x="300" y="884" font-size="11" font-weight="600" text-anchor="middle" fill="#C2C0B6">EV</text>
<text x="700" y="884" font-size="11" font-weight="600" text-anchor="middle" fill="#C2C0B6">P(win|b)</text>
<rect x="210" y="908" width="580" height="86" rx="10" fill="#444441" stroke="#B4B2A9" stroke-width="1"/>
<text x="500" y="940" text-anchor="middle" font-size="13" font-weight="600" fill="#D3D1C7">Profit-max optimiser  (inference-only, not trained)</text>
<text x="500" y="955" text-anchor="middle" font-size="12" font-weight="400" fill="#B4B2A9">bid*  =  argmax [  EV · P(win|b)  −  b · P(win|b)  ]</text>
</svg>