# =====================================================================
# T9 v6 — Benchmark & market config (USD, 2025 US mobile gaming)
# =====================================================================
# Mirrors "T9_Simulator_Schema - June 10 (v6).md" §Calibration.
#
# PROVENANCE: every calibratable leaf is a map {value, route, source}.
#   route: quoted          - computed directly from a cited number
#          auto-calibrated - solved so simulator aggregates hit cited targets
#          inferred        - documented judgment, flagged, sensitivity-tested
# config_loader flattens to plain values and collects the routes into the
# provenance registry (-> FN-1 calibration table).
# Structural lists/labels carry no route tag.

# ---------------------------------------------------------------------
# Funnel base rates (E1 click, F1 install, G1 payer)
# ---------------------------------------------------------------------
funnel:
  base_ctr:
    value: 0.08
    route: auto-calibrated
    source: "ceiling; population CTR target 2-5% (AppsFlyer/Adjust) via autocal loop"
  base_ir:
    value: 0.40
    route: auto-calibrated
    source: "ceiling; click->install target 25-40% (AppsFlyer) via autocal loop"
  base_payer:
    value: 0.55
    route: auto-calibrated
    source: "scales LU4 so install->payer lands 2-5% (DeltaDNA 4% NA) via autocal loop"
  w_stage:                       # m_stage(r) = (1-w) + w * r  (relevance weight)
    click:
      value: 0.5
      route: inferred
      source: "relevance moves CTR ~2x between r=0 and r=1; review after golden run"
    install:
      value: 0.6
      route: inferred
      source: "interest matters more once attention is paid; review after golden run"
    pay:
      value: 0.7
      route: inferred
      source: "spend is the most interest-driven stage; review after golden run"
  click_delay_mean_s:
    value: 30
    route: inferred
    source: "E2 = D1 + Exp(30s); schema fixed constant"
  install_delay:                 # F2 = E2 + LogNormal(mu, sigma) seconds
    mu:
      value: 7.5                 # ln(~1800s) -> median ~30 min
      route: inferred
      source: "median click->install delay ~30min; structural only"
    sigma:
      value: 1.0
      route: inferred
      source: "wide right tail (hours); structural only"

# ---------------------------------------------------------------------
# LTV / spend (G2-G4). G2 = LogNormal(mu_cat, sigma) * LU5 * LC2
#   mu_cat = lognormal_mu + ln(ltv_multiplier(B2))
# G2 base carries the population anchors; LU5/LC2 are unit-median multipliers
# (no double-counting -- v5/v6 provenance table).
# ---------------------------------------------------------------------
ltv:
  base_median_usd:
    value: 6.0
    route: quoted
    source: "median spend per payer ~$6 (GameAnalytics/Wappier ARPPU)"
  base_mean_usd:
    value: 25.0
    route: quoted
    source: "mean spend per payer ~$25 (Unity; AppMagic transaction sizes)"
  lognormal_mu:
    value: 1.7918               # ln(6)
    route: quoted
    source: "mu = ln(median) = ln(6)"
  lognormal_sigma:
    value: 1.6889               # sqrt(2*ln(25/6))
    route: quoted
    source: "sigma = sqrt(2*ln(mean/median)); then refined vs whale target (autocal)"
  decay_d7:
    value: 0.40
    route: inferred
    source: "G3 = 0.40*G2; revenue-recognition curve judgment"
  decay_d30:
    value: 0.70
    route: inferred
    source: "G4 = 0.70*G2; revenue-recognition curve judgment"

# ---------------------------------------------------------------------
# App categories (B2): share, install ease, LTV tier
# ---------------------------------------------------------------------
app_categories:
  casual:
    share: {value: 0.50, route: quoted, source: "Sensor Tower / Newzoo genre mix"}
    install_ease: {value: 1.0, route: inferred, source: "reference genre"}
    ltv_multiplier: {value: 1.0, route: inferred, source: "reference (medium) tier"}
  strategy:
    share: {value: 0.20, route: quoted, source: "Sensor Tower / Newzoo genre mix"}
    install_ease: {value: 0.7, route: inferred, source: "bigger download/commitment"}
    ltv_multiplier: {value: 1.8, route: inferred, source: "high-LTV tier (AppMagic strategy ARPPU)"}
  rpg:
    share: {value: 0.20, route: quoted, source: "Sensor Tower / Newzoo genre mix"}
    install_ease: {value: 0.6, route: inferred, source: "heaviest commitment"}
    ltv_multiplier: {value: 1.8, route: inferred, source: "high-LTV tier"}
  hypercasual:
    share: {value: 0.10, route: quoted, source: "Sensor Tower / Newzoo genre mix"}
    install_ease: {value: 1.4, route: inferred, source: "instant-play installs"}
    ltv_multiplier: {value: 0.5, route: inferred, source: "low-IAP tier"}

# C4 ad_genre mix of CAMPAIGNS (demand side), SPEND-WEIGHTED (campaigns bid
# in auctions, so weight ~ budget). Calibrated 11 Jun 2026 from verified
# sources; genre folding: casino/puzzle/match/SIM/card/board->casual,
# action/shooter->rpg, SLG/4X->strategy, arcade->hypercasual.
ad_genre_mix:
  casual:
    value: 0.55
    route: inferred
    source: "BM-bounded: AppsFlyer 2026 — casual ~50% of $25B global UA spend (quoted anchor); +0.05 US/folding adjustment inferred (top US spenders are match-3; SocialPeta FY2025 creative share casual+casino+puzzle ~58%)"
  strategy:
    value: 0.17
    route: inferred
    source: "BM-bounded: SocialPeta FY2025 SLG creative share 6.7%, upweighted on per-title intensity (728 creatives/title/yr) + US iOS midcore +43% YoY; split vs rpg inferred"
  rpg:
    value: 0.20
    route: inferred
    source: "BM-bounded: SocialPeta FY2025 RPG 9.5% + Action 4.4% creative share, upweighted on top per-title intensity (>800 creatives/title/yr); split vs strategy inferred"
  hypercasual:
    value: 0.08
    route: inferred
    source: "BM-bounded: below supply share — AppsFlyer 2026: hypercasual UA spend declining in West (iOS -14%, West -16%); no demand-side share published"

# ---------------------------------------------------------------------
# Advertiser scale (C2) -- calibrated 11 Jun 2026: counts and spend are
# SEPARATE quantities. The advertiser POPULATION is overwhelmingly indie
# (SocialPeta: 84K+ active game advertisers/month vs a major cohort of a
# few hundred publishers — Sensor Tower: 828 games >$10M, 134 >$100M IAP).
# SPEND concentrates in the head (Sensor Tower: top-1% of game publishers
# = 92.5% of IAP revenue) — mapped to ad spend with an inferred discount
# (ad-monetized indies spend more per revenue $): major ~0.75 of spend.
# campaign_share allocates CAMPAIGN VOLUME (~spend) per tier directly;
# advertiser_share sets pool composition (min 1 advertiser per tier).
# ---------------------------------------------------------------------
advertiser_scale:
  indie:
    advertiser_share: {value: 0.85, route: quoted, source: "BM-proxy count mix: SocialPeta 84K+/mo advertisers vs Sensor Tower revenue-tier counts -> ~0.87/0.11/0.02 empirical"}
    campaign_share: {value: 0.05, route: inferred, source: "spend-share proxy from IAP top-1%=92.5% (Sensor Tower 2025), discounted for ad-monetized indie spend; range major 0.70-0.85"}
    k_cpa: {value: 0.8, route: inferred, source: "thinner margins -> lower bid level; no published bid-level-by-size data"}
  mid:
    advertiser_share: {value: 0.13, route: quoted, source: "BM-proxy count mix (Sensor Tower 828 games >$10M ~= mid cohort)"}
    campaign_share: {value: 0.20, route: inferred, source: "spend-share proxy, see indie"}
    k_cpa: {value: 1.0, route: inferred, source: "reference scale"}
  major:
    advertiser_share: {value: 0.02, route: quoted, source: "BM-proxy count mix (top-1% publisher cohort; 134 games >$100M)"}
    campaign_share: {value: 0.75, route: inferred, source: "spend-share proxy from IAP concentration 92.5%, discounted; range 0.70-0.85"}
    k_cpa: {value: 1.2, route: inferred, source: "LTV-confident bidders bid up"}

# ---------------------------------------------------------------------
# Per-auction context: exchange (B3), format (B6), size|format (B4xB5)
# ---------------------------------------------------------------------
ad_exchanges:                    # 2025 US mediation shares
  "AppLovin MAX": {value: 0.52, route: quoted, source: "2025 mediation reports: MAX >50%"}
  "Unity LevelPlay": {value: 0.20, route: quoted, source: "2025 mediation reports"}
  "Google AdMob": {value: 0.20, route: quoted, source: "2025 mediation reports"}
  "Mintegral": {value: 0.05, route: inferred, source: "tail split judgment"}
  "Liftoff Monetize": {value: 0.03, route: inferred, source: "tail split judgment"}

# B6 impression mix — no measured distribution exists (Tenjin/CAS publish
# eCPM by format, never impression shares). Triangulated 11 Jun 2026:
# impression share ~ revenue share / eCPM, from Braberg-2025 revenue split
# {interstitial 50 / rewarded 35 / banner 15 % of ad revenue} and US eCPMs
# {banner ~$0.5-1.2, interstitial $14-20, rewarded $16-30 (Tenjin/CAS)}
# -> implied banner 0.70-0.85 / interstitial 0.10-0.20 / rewarded 0.05-0.10.
# Banner share is app-bimodal (~34% of games run banners at 10-60s refresh);
# genre-conditioning is a documented refinement (future work).
slot_format_shares:
  banner: {value: 0.70, route: inferred, source: "derived: rev-share/eCPM triangulation (Braberg 2025 x Tenjin/CAS US eCPMs); sensitivity range 0.55-0.85"}
  interstitial: {value: 0.20, route: inferred, source: "derived, see banner; old 0.30 was the optimistic-interstitial end"}
  rewarded: {value: 0.10, route: inferred, source: "derived, see banner; consistent with rev share 35% at ~20x banner eCPM"}

slot_sizes:                      # P(size | format); calibrated 11 Jun 2026
  banner:
    "320x50": {value: 0.80, route: inferred, source: "BM-bounded: Adpiler 2023 — 320x50 = 28.3% of ALL display imps vs 320x100 2.1% (~10x); AppLovin MAX auto-sizes phone banners to 320x50; exact in-app split unpublished"}
    "300x250": {value: 0.15, route: inferred, source: "BM-bounded: MREC is a separate MAX ad unit sized 300x250; Adpiler #1 overall (34.5%, web-skewed)"}
    "320x100": {value: 0.05, route: inferred, source: "BM-bounded: Adpiler 2.1% of display imps"}
  interstitial:                  # menu = Google Ad Manager doc (BM): phones 320x480/480x320
    "320x480": {value: 0.92, route: inferred, source: "menu quoted (Google AdMan: phone interstitials = 320x480 portrait / 480x320 landscape); orientation split inferred (casual portrait-dominant)"}
    "480x320": {value: 0.08, route: inferred, source: "landscape share inferred; no published orientation split"}
  rewarded:
    "320x480": {value: 1.0, route: quoted, source: "BM: rewarded = full-screen unit, no slot-size concept (Unity LevelPlay docs); device-resolution sampling via StatCounter US is the documented upgrade path"}

slot_quality:                    # v_slot = format_weight(B6) * size_weight(B4,B5)
  format_weight:
    banner: {value: 0.5, route: inferred, source: "attention proxy; eCPM-ordering consistent"}
    interstitial: {value: 1.0, route: inferred, source: "reference format"}
    rewarded: {value: 1.8, route: inferred, source: "opt-in attention premium"}
  size_weight:
    "320x50": {value: 0.9, route: inferred, source: "small banner"}
    "300x250": {value: 1.1, route: inferred, source: "MREC larger canvas"}
    "320x100": {value: 1.0, route: inferred, source: "reference"}
    "320x480": {value: 1.0, route: inferred, source: "full-screen (format_weight carries it)"}
    "480x320": {value: 1.0, route: inferred, source: "full-screen landscape (format_weight carries it)"}

# ---------------------------------------------------------------------
# Prices (H1 floor, base_eCPM for LU7/H4): iPinYou SHAPE x USD format target
# ---------------------------------------------------------------------
ecpm_targets_usd:                # median per-format eCPM targets, US 2025
  banner: {value: 1.00, route: quoted, source: "Tenjin US banner $0.5-1.5 midpoint"}
  interstitial: {value: 6.50, route: quoted, source: "Tenjin US interstitial $5-8 midpoint"}
  rewarded: {value: 18.00, route: quoted, source: "Tenjin US rewarded $15-30; Appodeal $18"}

prices:
  paying_shape_csv: ipinyou_paying_distribution.csv     # clearing-price SHAPE (IP)
  floor_shape_csv: ipinyou_floor_bid_distribution.csv   # floor SHAPE, ALL auctions (IP)
  # floor and base_eCPM values = (shape_value / paying_median) * ecpm_target(B6);
  # zero floors stay zero (~57% of auctions in iPinYou bid logs).

# ---------------------------------------------------------------------
# Auction (LU7 competing bid, H2 our bid)
# ---------------------------------------------------------------------
auction:
  # v10 privateness dial: amplitude of the rival-private structure (w_k, R, pacing) in
  # log b_ik. 0.0 = no private structure (the SSP-null regime); the paper runs rho = 0.8
  # (externally anchored, docs/v10_Anchor_Bands.md), passed per run via simulate(rho=...).
  rho: 0.0
  gamma:                         # market value-sensitivity (THE central knob; drives BOTH
    value: 0.45                  # the MMP lift (selection bias) and the SSP lift (price signal)
    route: inferred
    source: "partial-but-distinct layer lifts; swept in sect-6 sensitivity analysis"
  sigma_g:                       # gaming-competitor noise: eps_g ~ N(0, sigma_g)
    value: 0.35
    route: inferred
    source: "keeps clearing from fully fingerprinting EV"
  mu_x:                          # non-gaming demand: eps_x ~ N(mu_x, sigma_x)
    value: -0.45
    route: inferred
    source: "non-gaming demand usually below gaming valuation on gaming inventory"
  sigma_x:
    value: 0.55
    route: inferred
    source: "wide unexplainable-noise tail on losses"
  shade:                         # first-price bid shading on our value estimate
    value: 0.85
    route: inferred
    source: "first-price shading 0.7-1.0; midpoint"
  sigma_explore:                 # H2 exploration: LogNormal(0, sigma_explore)
    value: 0.30
    route: inferred
    source: "bid diversity for Tier-2 P(win|bid); review vs Tier-2 curve"
  k_global:                      # solved on warm-up so win rate hits profiles.win_rate.target
    value: 1.0
    route: auto-calibrated
    source: "global bid-level multiplier; bisection on warm-up sample (calibrated pinning)"

